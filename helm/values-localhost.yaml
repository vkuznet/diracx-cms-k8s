global:
  namespace: diracx-cms
  hostname: kubernetes.docker.internal
  releaseName: diracx-cms
  storageClass: hostpath
  storageClassRWX: hostpath

developer:
  enabled: false

# ── MySQL ─────────────────────────────────────
mysql:
  enabled: true
  rootUser: root
  rootPassword: "localhost-mysql-root-password"
  appUser: diracx
  appPassword: "localhost-mysql-password"
  replicationPassword: "localhost-mysql-replication-password"

# ── MinIO ─────────────────────────────────────
minio:
  enabled: true
  rootUser: minio
  rootPassword: "minio123"
  accessKeyId: "minio"
  secretAccessKey: "minio123"

# ── OpenSearch ────────────────────────────────
opensearch:
  enabled: true
  user: admin
  password: "admin"
  useSSL: false

# ── Dex (authentication) ──────────────────────
dex:
  staticClients:
    - id: myDIRACClientID
      name: "DiracX UI"
      public: true

  staticPasswords:
    - email: admin@example.com
      # bcrypt hash for "admin"
      hash: "$2y$10$tOLCbjaNP.MiQcsk3ui.L.uynTqLdCedt8pF/Q0m1eJgK72faUFGW"
      userID: admin
      username: admin

# local CS configuration file
csConfig:
  file: files/default.yml

# ── DiracX core config ────────────────────────
diracx:
  otelEnabled: false
  otelGrpcInsecure: true

  sandboxAutoCreateBucket: true
  sandboxBucketName: diracx-sandbox

  authAccessTokenExpireMinutes: 60
  authRefreshTokenExpireMinutes: 1440

  # databases used by template loops
  sqlDbs:
    - AuthDB
    - JobDB
    - JobLoggingDB
    - PilotAgentsDB
    - SandboxMetadataDB
    - DiracXAuthDB
    - TaskQueueDB
    - ResourceStatusDB

  osDbs:
    - JobParametersDB
    - PilotLogsDB

persistence:
  diracxCode:
    enabled: true
    path: /Users/vk/CMS/DMWM/GIT/DIRAC/diracx

# ── External (disabled since using internal services) ──
external:
  mysql:
    appUser: ""
    appPassword: ""
    rootUser: ""
    rootPassword: ""

  minio:
    accessKeyId: ""
    secretAccessKey: ""

  opensearch:
    user: ""
    password: ""
